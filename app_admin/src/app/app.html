<!-- main heading and navigation for the admin application -->
<header class="container pt-3">
  <h1 class="mb-3">Travlr Administration</h1>

  <nav class="d-flex gap-2" aria-label="Admin navigation">

    @if (authentication.isLoggedIn()) {
      <!-- navigation for authenticated administrators -->
      <a routerLink="/" class="btn btn-outline-primary">
        View Trips
      </a>

      <a routerLink="/add-trip" class="btn btn-primary">
        Add New Trip
      </a>

      <!-- end the administrator session -->
      <button
        type="button"
        class="btn btn-outline-danger"
        (click)="logout()">
        Logout
      </button>
    } @else {
      <!-- navigation for unauthenticated visitors -->
      <a routerLink="/login" class="btn btn-outline-primary">
        Sign In
      </a>
    }

  </nav>
</header>

<!-- displays the component associated with the current route -->
<router-outlet></router-outlet>
