
<!-- form for adding a new trip -->
<section class="container py-4">
  <h2 class="mb-4">Add New Trip</h2>

  <!-- displays errors returned by the api -->
  @if (errorMessage) {
    <div class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>
  }

  <form #tripForm="ngForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="code" class="form-label">Trip Code</label>
      <input type="text" class="form-control" id="code"
        name="code" [(ngModel)]="trip.code" required>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Trip Name</label>
      <input type="text" class="form-control" id="name"
        name="name" [(ngModel)]="trip.name" required>
    </div>

    <div class="mb-3">
      <label for="length" class="form-label">Duration</label>
      <input type="text" class="form-control" id="length"
        name="length" [(ngModel)]="trip.length"
        placeholder="4 nights / 5 days" required>
    </div>

    <div class="mb-3">
      <label for="start" class="form-label">Start Date</label>
      <input type="date" class="form-control" id="start"
        name="start" [(ngModel)]="trip.start" required>
    </div>

    <div class="mb-3">
      <label for="resort" class="form-label">Resort</label>
      <input type="text" class="form-control" id="resort"
        name="resort" [(ngModel)]="trip.resort" required>
    </div>

    <div class="mb-3">
      <label for="perPerson" class="form-label">Price Per Person</label>
      <input type="text" inputmode="decimal"
        class="form-control" id="perPerson"
        name="perPerson" [(ngModel)]="trip.perPerson"
        pattern="[0-9]+(\.[0-9]{1,2})?" 
        placeholder="999.00" required>
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">Image Filename</label>
      <input type="text" class="form-control" id="image"
        name="image" [(ngModel)]="trip.image"
        placeholder="reef1.jpg" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description"
        name="description" rows="4"
        [(ngModel)]="trip.description" required></textarea>
    </div>

    <!-- prevents submission of incomplete forms -->
    <button type="submit" class="btn btn-primary"
      [disabled]="tripForm.invalid || isSaving">
      {{ isSaving ? 'Saving...' : 'Add Trip' }}
    </button>

  </form>
</section>
